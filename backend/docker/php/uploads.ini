; Limites de upload alinhados com a validação da API (vídeo até 50 MB)
; e com o client_max_body_size 64M do nginx.
upload_max_filesize = 50M
post_max_size = 60M

; Sem php.ini na imagem base, display_errors fica ligado por omissão e
; corrompe as respostas JSON (ex.: warning de POST acima do limite).
display_errors = Off
log_errors = On
