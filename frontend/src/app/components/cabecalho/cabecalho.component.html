<header class="cabecalho">
  <div class="cabecalho__container">

    <div class="cabecalho__pesquisa">
      <span class="material-symbols-outlined cabecalho__pesquisa-icone">search</span>
      <input
        class="cabecalho__pesquisa-campo"
        placeholder="Pesquisar"
        type="text"
        [value]="termoPesquisa()"
        (input)="termoPesquisa.set($any($event.target).value)"
      />
    </div>

    <div class="cabecalho__direita">
      <button class="cabecalho__botao-icone" type="button" routerLink="/feed/estados" aria-label="Estados">
        <span class="material-symbols-outlined">grid_view</span>
      </button>

      @if (isAuthenticated()) {
        <button class="cabecalho__botao-icone" type="button" routerLink="/comentarios/moderacao" aria-label="Notificações">
          <span class="material-symbols-outlined">notifications</span>
        </button>

        <div class="cabecalho__utilizador">
          <a routerLink="/perfil" [attr.aria-label]="'Ver perfil de ' + nomeUtilizador()">
            <img
              [alt]="nomeUtilizador()"
              class="cabecalho__avatar"
              [src]="avatar()"
              [title]="nomeUtilizador()"
            />
          </a>
          <button
            class="cabecalho__botao-sair"
            type="button"
            (click)="sairDaSessao()"
            aria-label="Terminar sessão"
            title="Terminar sessão"
          >
            <span class="material-symbols-outlined">logout</span>
          </button>
        </div>
      } @else {
        <a class="botao-contornado" routerLink="/entrar">Entrar</a>
      }
    </div>

  </div>
</header>
