                  alt="Utilizador"

                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeKsXhqv8NVr26FuplH0IFQZlvDDjnwvqQJm1vrJ5yPeOyV4at0I864L0B4Vljr0XkSJLMag717M-qwKgFaekUuyjWNL7zLCzxBnIBLc_p1hqrjYGPyvdjMaE0BbX_TNeE88sYgDdqfA21K1yZXGWuT4Rr5CwnNdJEMIS_1hS039VozIvB2YOB8L5Mzpjae-zQsWd3wrIhizI6FQ3ALITZ9kIOZMgAORgh3RuTIMAdkD2YZocaAJGwop2qQfleyMClx3uQnzb_xXmt"

              </div>

                <button type="button" routerLink="/criar-post"><span class="material-symbols-outlined">image</span>Foto</button>
                <button type="button" routerLink="/criar-post"><span class="material-symbols-outlined">smart_display</span>Vídeo</button>
                <button type="button" routerLink="/eventos"><span class="material-symbols-outlined">event</span>Evento</button>
              </div>
            </div>

            @for (publicacao of publicacoes(); track publicacao.id) {
              <app-cartao-publicacao [publicacao]="publicacao" />
            }
          </section>

          <aside class="coluna">
            <div class="cartao cartao-preenchido">
              <span class="rotulo-seccao">Tendências</span>
              <h2 class="titulo-cartao">Cultura em alta</h2>
              <div class="lista-vertical painel-tags">
                <span class="pilula pilula-primaria">#Kizomba</span>
                <span class="pilula">#ArteAngolana</span>
                <span class="pilula">#Luanda</span>
                <span class="pilula pilula-secundaria">#Semba</span>

            </div>

            <div class="cartao cartao-preenchido">
              <div class="linha-distribuida">
                <h2 class="titulo-cartao">Sugestões</h2>
                <a class="botao-fantasma" routerLink="/sugestoes">Ver todas</a>
              </div>
              <div class="lista-vertical">
                <div class="item-lista">
                  <img
                    alt="Auroval Banger"

                <div class="item-lista">

                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEOSkDw4tgJcVw5GSD0c-W0NT4wn67wjBsApzX7EWAookXz9Di2R1FCBpAFk4eTy5_mLptwQ42qbxPBLxL3KREHOTwR3bKNeBSQz8f2APMR9OhkJ_MOauh7PkW6wgoynxvRSLpJr13a5JUE1OKmt8Mpbqs4zLeK8J4_rS825INSMWklOJVH4BAd9e3y-rTCxPXtOoGb4mqgcidEqXExMdeZUzjAIkx1_Dj4gy30Cu8Hjb1ujdtsrRn5qpXViatVkqxzb3NoH4OqLtY"

                  <div>
                    <strong>Sonca Awrama</strong>
                    <p class="texto-cartao">@nzolanetinar</p>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
