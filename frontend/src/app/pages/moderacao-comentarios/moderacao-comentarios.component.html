<section class="pagina-social">
  <div class="estrutura-aplicacao">
    <app-menu-lateral />
    <main>
      <app-cabecalho />
      <div class="conteudo-principal">
        <div class="conteudo-limite">
          <header class="cabecalho-pagina">
            <div>
              <span class="rotulo-seccao">Admin</span>
              <h1 class="titulo-pagina">Moderação de comentários</h1>
            </div>
          </header>
          <section class="cartao cartao-preenchido tabela-moderacao">
            <div class="linha-tabela cabecalho-tabela">
              <span>Autor</span><span>Comentário</span><span>Estado</span><span>Ações</span>
            </div>
            @for (comentario of comentariosPendentes(); track comentario.id) {
              <div class="linha-tabela">
                <span>{{ comentario.autor }}</span>
                <span>{{ comentario.texto }}</span>
                <span class="pilula pilula-secundaria">Pendente</span>
                <span class="grupo-botoes">
                  <button class="botao-contornado" type="button" (click)="moderarComentario(comentario.id, 'aprovado')">Aprovar</button>
                  <button class="botao-perigo" type="button" (click)="moderarComentario(comentario.id, 'removido')">Remover</button>
                </span>
              </div>
            } @empty {
              <div class="linha-tabela">
                <span>Sem pendentes</span><span>Todos os comentários foram moderados.</span><span class="pilula">Concluído</span><span></span>
              </div>
            }
          </section>
        </div>
      </div>
    </main>
  </div>
</section>
