<section class="pagina-social">
  <div class="estrutura-aplicacao">
    <app-menu-lateral />
    <main>
      <app-cabecalho />
      <div class="conteudo-principal">
        <form
          class="conteudo-limite cartao cartao-preenchido formulario perfil-formulario"
          [formGroup]="formulario"
          (ngSubmit)="guardar()"
        >
          <header class="cabecalho-pagina">
            <div>
              <span class="rotulo-seccao">Perfil</span>
              <h1 class="titulo-pagina">Editar perfil</h1>
            </div>
            <div class="acoes-cabecalho">
              <a class="botao-contornado" routerLink="/perfil">Cancelar</a>
              <button class="botao-destaque" type="submit" [disabled]="emSubmissao">
                {{ emSubmissao ? 'A guardar...' : 'Guardar' }}
              </button>
            </div>
          </header>

          <!-- Profile picture upload -->
          <div class="perfil-foto-upload">
            <img
              [src]="avatarPreview()"
              alt="Foto de perfil"
              class="perfil-foto-preview"
            />
            <div class="perfil-foto-accoes">
              <label class="botao-contornado perfil-foto-label" for="input-foto">
                <span class="material-symbols-outlined">photo_camera</span>
                Alterar foto
              </label>
              <input
                id="input-foto"
                type="file"
                accept="image/*"
                class="perfil-foto-input"
                aria-label="Selecionar foto de perfil"
                (change)="aoSelecionarFoto($event)"
              />
              <p class="texto-cartao">JPG, PNG ou GIF. Máx. 5 MB.</p>
            </div>
          </div>

          <input class="campo-formulario" formControlName="nome" placeholder="Nome completo" />
          @if (submetido && formulario.controls.nome.invalid) {
            <span class="mensagem-campo">Informe um nome válido.</span>
          }
          <input class="campo-formulario" formControlName="descricaoCurta" placeholder="Descrição curta" />
          <textarea class="area-formulario" formControlName="biografia" placeholder="Biografia"></textarea>
          @if (submetido && formulario.controls.biografia.invalid) {
            <span class="mensagem-campo">A biografia precisa de mais detalhes.</span>
          }
          <label class="linha-centro">
            <input type="checkbox" formControlName="privado" />
            Perfil privado
          </label>
          @if (erroApi()) {
            <span class="mensagem-campo">{{ erroApi() }}</span>
          }
          <div class="grupo-botoes">
            <span class="pilula pilula-primaria">Kizomba</span>
            <span class="pilula">Semba</span>
            <span class="pilula">Arte</span>
          </div>
        </form>
      </div>
    </main>
  </div>
</section>
