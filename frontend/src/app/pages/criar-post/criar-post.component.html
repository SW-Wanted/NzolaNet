<section class="pagina-social">
  <div class="estrutura-aplicacao">
    <app-menu-lateral />
    <main>
      <app-cabecalho />
      <div class="conteudo-principal">
        <form
          class="conteudo-limite cartao cartao-preenchido formulario editor-publicacao"
          [formGroup]="formulario"
          (ngSubmit)="publicar()"
        >
          <header class="cabecalho-pagina">
            <div>
              <span class="rotulo-seccao">Nova publicação</span>
              <h1 class="titulo-pagina">Criar post NzolaNet</h1>
            </div>
          </header>
          <textarea
            class="area-formulario"
            formControlName="conteudo"
            placeholder="O que está a acontecer na cultura angolana?"
          ></textarea>
          @if (submetido && formulario.controls.conteudo.invalid) {
            <span class="mensagem-campo">Escreva pelo menos 10 caracteres antes de publicar.</span>
          }
          @if (erroApi()) {
            <span class="mensagem-campo">{{ erroApi() }}</span>
          }
          <div class="grelha-cartoes">
            <label class="cartao cartao-preenchido anexo-post" for="input-imagem">
              <span class="material-symbols-outlined">image</span>Adicionar imagem (máx. 8 MB)
              <input
                id="input-imagem"
                type="file"
                accept="image/*"
                class="perfil-foto-input"
                aria-label="Selecionar imagem"
                (change)="aoSelecionarMedia($event, 'imagem')"
              />
            </label>
            <label class="cartao cartao-preenchido anexo-post" for="input-video">
              <span class="material-symbols-outlined">smart_display</span>Adicionar vídeo (máx. 50 MB)
              <input
                id="input-video"
                type="file"
                accept="video/*"
                class="perfil-foto-input"
                aria-label="Selecionar vídeo"
                (change)="aoSelecionarMedia($event, 'video')"
              />
            </label>
          </div>
          @if (previewMedia()) {
            <div class="media-preview">
              @if (tipoMedia() === 'imagem') {
                <img [src]="previewMedia()" alt="Pré-visualização" class="media-preview__imagem" />
              } @else {
                <video [src]="previewMedia()" controls class="media-preview__video" aria-label="Pré-visualização do vídeo"></video>
              }
              <button class="botao-fantasma media-preview__remover" type="button" (click)="removerMedia()">
                <span class="material-symbols-outlined">close</span>Remover
              </button>
            </div>
          }
          <div class="linha-distribuida">
            <a class="botao-contornado" routerLink="/feed">Cancelar</a>
            <button class="botao-destaque" type="submit" [disabled]="emSubmissao">
              {{ emSubmissao ? 'A publicar...' : 'Publicar' }}
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</section>
