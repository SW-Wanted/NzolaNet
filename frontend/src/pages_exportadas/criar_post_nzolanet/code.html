<!-- Micro-interaction Script -->
<script>
        const postInput = document.getElementById('post-input');
        const publishBtn = document.querySelector('button.bg-primary-container');
        
        // Auto-expand textarea
        postInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            // Enable/Disable publish button based on content
            if(this.value.trim().length > 0) {
                publishBtn.style.opacity = '1';
                publishBtn.style.pointerEvents = 'auto';
            } else {
                // Keep it active for the demo though
            }
        });

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.history.back();
        });

        // Simple click interaction for the overlay
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) {
                // Close simulation
                document.getElementById('modal-overlay').style.opacity = '0';
                setTimeout(() => window.history.back(), 200);
            }
        });
    </script>
