<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-md nzola-pattern-bg">
<!-- Login Container -->
<main class="w-full max-w-[460px] animate-fade-in">
<!-- Brand Identity Top -->
<div class="flex flex-col items-center mb-xl">
<div class="w-20 h-20 mb-md relative">
<img alt="NzolaNet Official Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxeSmCWcMoRVI20C-My1JBGLSL2ntLE4EyIpBSv-x1gldBAAPdel_3hZKfWf94yaI11AStX8cZ9ApuPzRBfe6wig_9HtJyIZtME8hhsmXRRuWN9RXzDiatSOy9tZDYVxPYZzGfkNzje85MyaNOp2IUbEkbLehnqeDVqH2UChhJjUHxUO9Dk6guE_hBtM8PGpOpqS9-Wj6j9Do7Q70XV75OcdmNP0-czORUU_7EtR7dMMmrplnvMw5naJ1E6C_7pOp5pHRrJy1Da_Qh"/>
</div>
<h1 class="font-display-lg text-primary text-headline-lg-mobile md:text-headline-lg tracking-tight">NzolaNet</h1>
<p class="text-on-surface-variant font-label-lg mt-xs uppercase tracking-widest">Cultura &amp; Conexão</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-xl premium-shadow border border-outline-variant/30 relative overflow-hidden">
<!-- Subtle Texture Watermark (Mwana Pwo Inspired) -->
<div class="absolute -right-12 -bottom-12 opacity-[0.03] pointer-events-none w-48 h-48">
<span class="material-symbols-outlined text-[192px] text-primary">face_6</span>
</div>
<div class="relative z-10">
<header class="mb-xl">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Bem-vindo de volta</h2>
<p class="text-on-surface-variant font-body-sm">Inicie sessão para explorar o coração da cultura Angolana.</p>
</header>
<form action="#" class="space-y-lg" method="POST">
<!-- Email / Username Field -->
<div class="space-y-sm">
<label class="block font-label-lg text-on-surface" for="identity">Email ou Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant" id="identity" name="identity" placeholder="ex: mwana_pgolana" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-lg text-on-surface" for="password">Palavra-passe</label>
<a class="text-label-sm text-primary hover:underline transition-all" href="#">Esqueceu-se da palavra-passe?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-[48px] pr-[48px] py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" id="password" name="password" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-md">
<button class="w-full py-md bg-primary text-on-primary font-headline-sm rounded-lg hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-xl pt-xl border-t border-outline-variant/30 text-center">
<p class="text-on-surface-variant font-body-sm">
                        Ainda não tem uma conta? 
                        <a class="text-primary font-label-lg hover:underline ml-xs" href="#">Criar Conta</a>
</p>
</div>
</div>
</div>

<img class="w-full h-full object-cover blur-[80px] opacity-[0.08]" data-alt="A warm, atmospheric scene of Angolan sun-drenched savannah landscape at sunset. The lighting is golden and soft, creating a premium light-mode aesthetic. The colors are dominated by earthy ochres, soft beige, and deep oranges, perfectly complementing a sophisticated digital interface. The mood is serene and welcoming, reflecting a high-fidelity social network experience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8dW_D_lAVbG8xuzmXTYZmEKNUuhORNeCZkP1RhsLZx4beXL7slci62yX86Wu8vE6iNpuukkdMEcm36ZN4wjLP97UNW6Uv7jUnKT0Hs__3dI0ezDl7cJwVHhz2MslJajwQVi6TqdH-4G0r8wuvIf4OJQIWwImyzbiuDnw9_aKgRpmjXy12i9RrfNBz09eyIYWw_W05SHS6drQND4jRot4uCNjw6J0vstt6wfbWjLdh1U-qgddJKMD54-dVaG3VUXWAULPq1K7jr3-R"/>
</div>
</main>
<script>
        // Micro-interactions for the login experience
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Toggle Password Visibility logic
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        togglePass.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            togglePass.querySelector('span').innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple Fade In Animation on Load
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('opacity-0');
            setTimeout(() => {
                document.body.classList.remove('opacity-0');
                document.body.classList.add('transition-opacity', 'duration-1000', 'opacity-100');
            }, 100);
        });
    </script>
