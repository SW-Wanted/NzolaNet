<!DOCTYPE html>

<html lang="pt"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "secondary-container": "#fe4ea2",
                        "inverse-on-surface": "#faeee9",
                        "secondary": "#b7056b",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#ebe0db",
                        "tertiary": "#87512c",
                        "primary-fixed": "#ffdea4",
                        "surface-container": "#f7ece6",
                        "on-tertiary-fixed": "#311300",
                        "on-secondary-container": "#5c0033",
                        "on-tertiary-fixed-variant": "#6b3a17",
                        "on-primary-container": "#4b3500",
                        "secondary-fixed": "#ffd9e4",
                        "on-secondary-fixed": "#3e0020",
                        "inverse-surface": "#352f2c",
                        "surface-bright": "#fff8f5",
                        "primary-fixed-dim": "#f0bf5c",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#f0bf5c",
                        "surface-dim": "#e3d8d3",
                        "surface": "#fff8f5",
                        "background": "#fff8f5",
                        "on-secondary-fixed-variant": "#8d0051",
                        "secondary-fixed-dim": "#ffb0cc",
                        "primary": "#7b5900",
                        "tertiary-container": "#d59369",
                        "on-surface-variant": "#4e4637",
                        "tertiary-fixed-dim": "#feb78a",
                        "surface-container-high": "#f1e6e1",
                        "on-tertiary-container": "#592c0a",
                        "primary-container": "#c89b3c",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#d2c5b1",
                        "on-background": "#201b18",
                        "surface-variant": "#ebe0db",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#201b18",
                        "surface-container-low": "#fdf1ec",
                        "surface-tint": "#7b5900",
                        "on-primary-fixed-variant": "#5d4200",
                        "on-primary-fixed": "#261900",
                        "tertiary-fixed": "#ffdbc7",
                        "outline": "#807665"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "xl": "32px",
                        "xs": "4px",
                        "xxl": "48px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter": "20px",
                        "sm": "8px",
                        "md": "16px",
                        "base": "4px",
                        "max-width": "1200px"
                    },
                    "fontFamily": {
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.2; }
        }
        .bg-success-modal { background-color: #F5F0EB; }
    </style>
</head>
<body class="bg-background text-on-surface m-0 p-0 overflow-hidden">
<!-- Background Screen (Blurred Registration Form) -->
<main class="min-h-screen flex items-center justify-center p-6 blur-md brightness-90 grayscale-[0.2] transition-all duration-700">
<div class="max-w-[400px] w-full space-y-8 bg-surface p-8 rounded-xl shadow-sm border border-outline-variant/30">
<div class="flex justify-center mb-8">
<img alt="NzolaNet Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzF4MCP7sTcdBK8EQm735ihOuwqDbcpWdvcvtpklDYbMGRJ00rOk770WaooO8arp00ffZVy-8iIQJZ6idyb7byfiJiO5aVjLJalf9ZTt0ohgYy0vZqxmzlA9yA3gTXFhh8kly-O1AsBcF1go3csXojKqHzvcfTXm1VyeYUVbm9TIKhKT9uf8xlO_t7e9pqTL6rnN0S6ORFBtqZqKOzfOZi2Thg5S24viH24G387_h5-t4QD79Bg-gFt7TDNizM6hzvzc5nqjXgIRq8"/>
</div>
<div class="space-y-4">
<div class="h-12 bg-surface-container-highest rounded-lg w-full"></div>
<div class="h-12 bg-surface-container-highest rounded-lg w-full"></div>
<div class="h-12 bg-surface-container-highest rounded-lg w-full"></div>
<div class="h-12 bg-primary/20 rounded-lg w-full"></div>
</div>
<div class="pt-4 border-t border-outline-variant/30 text-center">
<div class="h-4 bg-surface-container-highest rounded w-3/4 mx-auto"></div>
</div>
</div>
</main>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-on-background/40 backdrop-blur-sm p-margin-mobile">
<!-- Success Modal -->
<section class="bg-success-modal w-full max-w-[440px] rounded-xl shadow-xl overflow-hidden transform transition-all animate-in fade-in zoom-in duration-300 flex flex-col items-center p-xl md:p-xxl text-center relative">
<!-- Branding Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container via-primary to-primary-container"></div>
<!-- Logo in Modal -->
<div class="mb-lg">
<img alt="NzolaNet Brand" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzF4MCP7sTcdBK8EQm735ihOuwqDbcpWdvcvtpklDYbMGRJ00rOk770WaooO8arp00ffZVy-8iIQJZ6idyb7byfiJiO5aVjLJalf9ZTt0ohgYy0vZqxmzlA9yA3gTXFhh8kly-O1AsBcF1go3csXojKqHzvcfTXm1VyeYUVbm9TIKhKT9uf8xlO_t7e9pqTL6rnN0S6ORFBtqZqKOzfOZi2Thg5S24viH24G387_h5-t4QD79Bg-gFt7TDNizM6hzvzc5nqjXgIRq8"/>
</div>
<!-- Success Icon -->
<div class="relative mb-lg flex items-center justify-center">
<div class="absolute w-24 h-24 bg-primary/10 rounded-full success-glow"></div>
<div class="relative w-16 h-16 rounded-full border-[3px] border-primary flex items-center justify-center bg-on-primary">
<span class="material-symbols-outlined text-primary !text-[40px]" data-icon="check" style="font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Content -->
<div class="space-y-md mb-xxl">
<h1 class="font-headline-md text-headline-md text-on-surface">
                    Conta Criada com Sucesso!
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Já podes aceder à tua conta e explorar a plataforma.
                </p>
</div>
<!-- Action Button -->
<button class="group w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg shadow-sm hover:bg-primary/90 hover:shadow-md active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm" onclick="window.location.reload()">
                Ir para o Login
                <span class="material-symbols-outlined !text-lg transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Decorative Pattern (Subtle) -->
<div class="absolute -bottom-8 -right-8 opacity-[0.03] pointer-events-none rotate-12">
<span class="material-symbols-outlined !text-[160px]" data-icon="celebration">celebration</span>
</div>
</section>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.querySelector('section');
            // Adding a small delay for a smoother reveal effect
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'scale-95');
                modal.classList.add('opacity-100', 'scale-100');
            }, 100);
        });

        // Interactive Button Hover Effect
        const btn = document.querySelector('button');
        btn.addEventListener('mouseenter', () => {
            document.querySelector('.success-glow').style.animationDuration = '1s';
        });
        btn.addEventListener('mouseleave', () => {
            document.querySelector('.success-glow').style.animationDuration = '2s';
        });
    </script>
</body></html>
