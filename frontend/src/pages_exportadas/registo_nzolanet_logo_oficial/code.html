<style>
        body {
            background-color: #F6F1EA;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(123, 89, 0, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
        }
        .input-clay {
            background-color: #EFE7DC;
            transition: all 0.3s ease;
        }
        .input-clay:focus {
            background-color: #FFFFFF;
            box-shadow: 0 0 0 2px #C89B3C;
            outline: none;
        }
        .pattern-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-md md:p-xxl relative overflow-hidden">
<!-- Background Heritage Patterns -->
<div class="pattern-overlay hidden md:block">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="100" id="samakaka" patternunits="userSpaceOnUse" width="100" x="0" y="0">
<path d="M50 0 L100 50 L50 100 L0 50 Z" fill="none" stroke="#1F1A17" stroke-width="0.5"></path>
<circle cx="50" cy="50" fill="none" r="10" stroke="#1F1A17" stroke-width="0.5"></circle>
</pattern>
</defs>
<rect fill="url(#samakaka)" height="100%" width="100%"></rect>
</svg>
</div>
<main class="w-full max-w-[520px] z-10">
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(60,40,20,0.06)] overflow-hidden relative border border-outline-variant/30">

<div class="flex flex-col items-center gap-sm mb-md">
<div class="w-16 h-16 flex items-center justify-center rounded-full bg-primary-container/10 p-2">
<img alt="Cora77o de Samakaka Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxeSmCWcMoRVI20C-My1JBGLSL2ntLE4EyIpBSv-x1gldBAAPdel_3hZKfWf94yaI11AStX8cZ9ApuPzRBfe6wig_9HtJyIZtME8hhsmXRRuWN9RXzDiatSOy9tZDYVxPYZzGfkNzje85MyaNOp2IUbEkbLehnqeDVqH2UChhJjUHxUO9Dk6guE_hBtM8PGpOpqS9-Wj6j9Do7Q70XV75OcdmNP0-czORUU_7EtR7dMMmrplnvMw5naJ1E6C_7pOp5pHRrJy1Da_Qh"/>
</div>
<h1 class="font-display-lg text-primary text-headline-lg tracking-tight">NzolaNet</h1>
<p class="font-label-md text-on-surface-variant max-w-[280px] mx-auto">
                        Cultura Angolana em cada conexão. Junte-se à nossa baze.
                    </p>
</div>
<div class="space-y-xs">
<h2 class="font-headline-md text-on-surface text-headline-sm md:text-headline-md">Junte-se à comunidade</h2>
</div>
</div>
<!-- Registration Form -->
<form class="px-xl pb-xl space-y-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant flex items-center gap-xs" for="full_name">
<span class="material-symbols-outlined text-[18px]">person</span>
                        Nome Completo
                    </label>
<input class="w-full h-12 px-md rounded-lg input-clay border-none text-body-md placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" id="full_name" placeholder="Ex: António Agostinho" type="text"/>
</div>
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant flex items-center gap-xs" for="username">
<span class="material-symbols-outlined text-[18px]">alternate_email</span>
                        Nome de Utilizador
                    </label>
<div class="relative">
<input class="w-full h-12 px-md rounded-lg input-clay border-none text-body-md placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" id="username" placeholder="seu_nome" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant flex items-center gap-xs" for="email">
<span class="material-symbols-outlined text-[18px]">mail</span>
                        Email
                    </label>
<input class="w-full h-12 px-md rounded-lg input-clay border-none text-body-md placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" id="email" placeholder="exemplo@nzo.la" type="email"/>
</div>
<!-- Password Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant flex items-center gap-xs" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                            Palavra-passe
                        </label>
<input class="w-full h-12 px-md rounded-lg input-clay border-none text-body-md placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant flex items-center gap-xs" for="confirm_password">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
                            Confirmar
                        </label>
<input class="w-full h-12 px-md rounded-lg input-clay border-none text-body-md placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-all" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms and Privacy -->
<div class="flex items-start gap-sm pt-xs">
<input class="mt-1 rounded text-primary focus:ring-primary-container bg-surface-container-high border-outline-variant" id="terms" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant leading-tight" for="terms">
                        Ao criar uma conta, aceito os <a class="text-primary font-semibold hover:underline" href="#">Termos de Serviço</a> e a <a class="text-primary font-semibold hover:underline" href="#">Política de Privacidade</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full h-14 mt-md bg-primary hover:bg-primary-fixed-variant text-on-primary font-label-lg text-label-lg rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-sm" type="submit">
                    Criar Conta
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Alternative Action -->
<div class="text-center pt-md border-t border-outline-variant/30">
<p class="font-body-sm text-on-surface-variant">
                        Já tem uma conta? <a class="text-secondary font-bold hover:underline" href="#">Entrar na NzolaNet</a>
</p>
</div>
</form>
<!-- Decorative mask illustration (bottom right) -->
<div class="absolute -bottom-8 -right-8 opacity-5 pointer-events-none select-none">

                #Kizomba
            </span>

                #ArteAngolana
            </span>
<span class="px-md py-xs bg-white/50 border border-outline-variant/20 rounded-full font-label-sm text-primary flex items-center gap-xs">
                #Cultura
            </span>
<span class="px-md py-xs bg-white/50 border border-outline-variant/20 rounded-full font-label-sm text-primary flex items-center gap-xs">
                #Luanda
            </span>
</div>
</main>
<!-- Visual Footer -->
<footer class="fixed bottom-0 w-full p-md text-center hidden md:block">
<p class="font-label-sm text-on-surface-variant opacity-60">
            © 2024 NzolaNet - Inspirado na alma de Angola.
        </p>
</footer>
<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Floating effect for background elements
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.pattern-overlay').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
