<!-- Success Modal -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative w-full max-w-[520px] bg-surface-container-lowest rounded-[1rem] shadow-premium p-xxl flex flex-col items-center text-center transform transition-all scale-100 duration-300" role="dialog" style="transform: scale(1);">

<button class="absolute top-lg right-lg text-on-surface-variant hover:bg-surface-container-high p-xs rounded-full transition-colors" onclick="closeModal()">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Success Icon Section -->
<div class="mb-xl">
<div class="w-24 h-24 bg-primary-fixed rounded-full flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="check_circle" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
</div>
<!-- Content Section -->

                </h2>

                </p>
</div>
<!-- Action Button -->

                Continuar
            </button>
<!-- Decorative Subtle Pattern -->
<div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-30"></div>
</div>

<script>
        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('div');
            
            // Outward animation
            modal.style.transform = 'scale(0.95)';
            overlay.style.opacity = '0';
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                // Optional: Restore main content focus/blur
                document.querySelector('main').classList.remove('blur-[2px]', 'opacity-40');
            }, 300);
        }

        // Entrance animation trigger
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('modal-overlay');
            const modal = overlay.querySelector('div');
            
            overlay.style.opacity = '0';
            modal.style.transform = 'scale(0.9)';
            
            requestAnimationFrame(() => {
                overlay.style.opacity = '1';
                modal.style.transform = 'scale(1)';
            });
        });
    </script>
